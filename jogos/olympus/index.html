<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Orpheus: Song of Olympus</title>
    <meta name="description" content="Jogo de ação e aventura em pixel art no estilo NES, inspirado no mito de Orfeu e nos clássicos de 8 bits.">
    <meta name="theme-color" content="#000000">
    <link rel="stylesheet" href="css/game.css">
</head>
<body>
    <main id="wrap">
        <canvas id="screen" width="256" height="240" aria-label="Tela do jogo Orpheus: Song of Olympus"></canvas>
    </main>

    <div id="touch" aria-hidden="true">
        <div class="dpad"><span class="arrow up"></span><span class="arrow down"></span><span class="arrow left"></span><span class="arrow right"></span></div>
        <div class="mid"><button type="button" data-k="start">START</button></div>
        <div class="ab">
            <button type="button" class="b" data-k="attack">B</button>
            <button type="button" class="a" data-k="jump">A</button>
        </div>
    </div>

    <noscript><p class="noscript">Ative o JavaScript para jogar.</p></noscript>

    <script src="js/core.js"></script>
    <script src="js/pix.js"></script>
    <script src="js/sprites.js"></script>
    <script src="js/tiles.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/input.js"></script>
    <script src="js/levels.js"></script>
    <script src="js/story.js"></script>
    <script src="js/entities.js"></script>
    <script src="js/game.js"></script>
    <script src="js/render.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
