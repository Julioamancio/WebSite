<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Orpheus: Song of Olympus</title>
    <meta name="description" content="Jogo de ação e aventura em 2.5D, inspirado no mito de Orfeu e nos clássicos de plataforma.">
    <meta name="theme-color" content="#000000">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Marcellus&display=swap">
    <link rel="stylesheet" href="css/game.css">
</head>
<body>
    <main id="wrap">
        <canvas id="screen" width="1920" height="1080" aria-label="Tela do jogo Orpheus: Song of Olympus"></canvas>
    </main>

    <div id="touch" aria-hidden="true">
        <div class="dpad"><span class="arrow up"></span><span class="arrow down"></span><span class="arrow left"></span><span class="arrow right"></span></div>
        <div class="mid"><button type="button" class="sw" data-k="swap" aria-label="Trocar arma">&#x2694;</button><button type="button" data-k="start">START</button><button type="button" class="fs" aria-label="Tela cheia">&#x26F6;</button></div>
        <div class="ab">
            <button type="button" class="b" data-k="attack">B</button>
            <button type="button" class="a" data-k="jump">A</button>
        </div>
    </div>

    <noscript><p class="noscript">Ative o JavaScript para jogar.</p></noscript>

    <script src="js/core.js"></script>
    <script src="js/pix.js"></script>
    <script src="js/sprites.js"></script>
    <script src="js/tiles.js"></script>
    <script src="js/art/world.js"></script>
    <script src="js/art/sky.js"></script>
    <script src="js/art/hero.js"></script>
    <script src="js/art/npcs.js"></script>
    <script src="js/art/enemies.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/input.js"></script>
    <script src="js/levels.js"></script>
    <script src="js/story.js"></script>
    <script src="js/entities.js"></script>
    <script src="js/game.js"></script>
    <script src="js/render.js"></script>
    <script src="js/ui.js"></script>
    <script src="assets/web/sprites/manifest.js"></script>
    <script src="js/hd.js"></script>
    <script src="js/cutscene.js"></script>
    <script src="js/hdui.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
